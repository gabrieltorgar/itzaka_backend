[project]
name = "presuplano-backend"
version = "3.3.1"
description = "CUOTREKA — cotizador multi-tenant para arquitectos (backend API)"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<5.3",
    "djangorestframework>=3.15,<3.17",
    "djangorestframework-simplejwt>=5.3,<6",
    "django-cors-headers>=4.4,<5",
    "django-environ>=0.11,<0.13",
    "django-filter>=24.3,<26",
    "psycopg[binary]>=3.2,<4",
    "pillow>=10.4,<12",
    "whitenoise>=6.7,<7",
    "django-storages[s3]>=1.14,<2",
    "boto3>=1.35,<2",
    "anthropic>=1,<2",
    "opencv-python-headless>=4.10,<6",
    "numpy>=2,<3",
    "filetype>=1.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-django>=4.9,<5",
    "pytest-cov>=5.0,<7",
    "pytest-mock>=3.14,<4",
    "factory-boy>=3.3,<4",
    "ruff>=0.6,<1",
]

[tool.vercel]
# Donde Vercel encuentra la instancia WSGI. Sin esto tendría que adivinarla, y
# el proyecto vive bajo src/, que no es donde importa.
entrypoint = "wsgi:application"

[tool.ruff]
line-length = 88
# scripts/test_gate.py es la herramienta del quality gate, copiada tal cual del flujo.
extend-exclude = ["scripts/test_gate.py"]
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ", "S", "LOG", "G"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "common", "core", "api"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106", "S107"]
"**/test_*.py" = ["S101", "S105", "S106", "S107"]
"**/migrations/**" = ["E501"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "core.settings"
pythonpath = ["src"]
python_files = ["test_*.py", "tests.py"]
addopts = "--reuse-db"
testpaths = ["src"]
markers = [
    "no_cotas_mock: la lectura rápida de las cotas no se simula (se prueba la llamada real)",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/test_*.py",
    "src/conftest.py",
    "src/core/settings*.py",
    "src/core/asgi.py",
    "src/core/wsgi.py",
    "src/manage.py",
]

[tool.coverage.report]
show_missing = false
skip_covered = true
